name: Automotivemedium Continuous Integration (CI)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    name: Backend Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Verify Environment Template
        working-directory: backend
        run: |
          test -f .env.example || exit 1
          echo "✅ .env.example verified"

      - name: Run Backend Unit & Health Tests
        working-directory: backend
        env:
          NODE_ENV: test
          PORT: 5000
          JWT_SECRET: ci_test_secret_key_minimum_32_chars_long
          MONGODB_URI: mongodb://localhost:27017/automotivemedium_test
        run: npm test

  frontend-build:
    name: Frontend Quality & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify Environment Template
        working-directory: frontend
        run: |
          test -f .env.example || exit 1
          echo "✅ .env.example verified"

      - name: Build Vite Production Bundle
        working-directory: frontend
        env:
          VITE_API_URL: /api
        run: npm run build

      - name: Verify Distribution Chunks & Size
        working-directory: frontend
        run: |
          ls -lh dist/assets
          test -f dist/index.html || exit 1
          echo "✅ Frontend production build artifact verified"
